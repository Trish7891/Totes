[package]
name = "safecell-policy"
version = "1.0.0"
edition = "2021"
description = "On-chain spend policy and receipt anchoring for SafeCell agent executions"
license = "MIT"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
near-sdk = "5.6"

[dev-dependencies]
near-sdk = { version = "5.6", features = ["unit-testing"] }

[profile.release]
codegen-units = 1
opt-level = "z"
lto = true
debug = false
panic = "abort"
overflow-checks = true
